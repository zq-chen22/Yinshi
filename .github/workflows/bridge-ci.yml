name: Bridge verification
on:
  push:
    paths: ['codex-feishu-bridge/**', 'deploy/**', '.github/workflows/bridge-ci.yml']
  pull_request:
    paths: ['codex-feishu-bridge/**', 'deploy/**', '.github/workflows/bridge-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install './codex-feishu-bridge[test]'
      - run: python -m pytest -q codex-feishu-bridge/tests
      - run: python -m pip check
      - run: python -m pip wheel --no-deps ./codex-feishu-bridge --wheel-dir dist
